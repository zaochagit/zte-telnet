name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build for Windows
        run: |
          cd cmd
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o zte-telnet.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zte-telnet-windows
          path: cmd/zte-telnet.exe
